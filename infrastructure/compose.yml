volumes:
  redis:

services:
  redis:
    image: redis:8.10.3-alpine
    pull_policy: ${PULL_POLICY:-missing}
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis:/data
    healthcheck:
      test: redis-cli -a ${REDIS_PASSWORD:?error} ping
      interval: 60s
      start_interval: 5s
      timeout: 5s
      retries: 4
      start_period: 30s
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?error}
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
